{% extends "base.html" %}

{% block title %}Password Updated — Freelancer OS{% endblock %}

{% block content %}
<div class="row justify-content-center py-4">
    <div class="col-md-7 col-lg-5 text-center">
        <div class="custom-card p-4 p-md-5">
            <span class="badge bg-success-subtle text-success border border-success-subtle px-2 py-1 mb-3">
                <i class="bi bi-check2 me-1"></i> Success
            </span>
            <h1 class="h3 fw-normal mb-2">Password updated</h1>
            <p class="text-muted small mb-4">
                Your password has been successfully updated. You can now sign in with your new credentials.
            </p>

            <a href="{% url 'login' %}" class="btn btn-brand btn-sm">
                Sign In to Workspace →
            </a>
        </div>
    </div>
</div>
{% endblock %}
