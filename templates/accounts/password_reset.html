{% extends "base.html" %}

{% block content %}

<style>
    .password-page {
        min-height: calc(100vh - 80px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 60px 24px;
        background: #fbfaf7;
    }

    .password-wrapper {
        width: 100%;
        max-width: 520px;
    }

    .password-intro {
        text-align: center;
        margin-bottom: 28px;
    }

    .password-eyebrow {
        font-family: "Plus Jakarta Sans", sans-serif;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #78716c;
        margin-bottom: 12px;
    }

    .password-intro h1 {
        font-family: "Newsreader", serif;
        font-size: clamp(38px, 6vw, 52px);
        font-weight: 500;
        line-height: 1;
        color: #1c1917;
        margin: 0 0 16px;
    }

    .password-intro p {
        font-family: "Plus Jakarta Sans", sans-serif;
        font-size: 15px;
        line-height: 1.7;
        color: #78716c;
        max-width: 440px;
        margin: 0 auto;
    }

    .password-card {
        background: #ffffff;
        border: 1px solid #e7e4dc;
        border-radius: 18px;
        padding: 34px;
        box-shadow: 0 10px 35px rgba(28, 25, 23, 0.05);
    }

    .password-card form p {
        margin-bottom: 22px;
    }

    .password-card label {
        display: block;
        font-family: "Plus Jakarta Sans", sans-serif;
        font-size: 13px;
        font-weight: 600;
        color: #44403c;
        margin-bottom: 8px;
    }

    .password-card input {
        width: 100%;
        padding: 13px 14px;
        border: 1px solid #e7e4dc;
        border-radius: 10px;
        background: #fbfaf7;
        color: #1c1917;
        font-family: "Plus Jakarta Sans", sans-serif;
        font-size: 14px;
        outline: none;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
        box-sizing: border-box;
    }

    .password-card input:focus {
        border-color: #1c1917;
        box-shadow: 0 0 0 3px rgba(28, 25, 23, 0.06);
    }

    .password-card ul.errorlist {
        margin: 7px 0 0;
        padding: 0;
        list-style: none;
        color: #a83b32;
        font-family: "Plus Jakarta Sans", sans-serif;
        font-size: 12px;
    }

    .password-submit {
        width: 100%;
        border: none;
        border-radius: 10px;
        padding: 14px 18px;
        background: #1c1917;
        color: #ffffff;
        font-family: "Plus Jakarta Sans", sans-serif;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: transform 0.2s ease, opacity 0.2s ease;
    }

    .password-submit:hover {
        opacity: 0.9;
        transform: translateY(-1px);
    }

    .password-footer {
        text-align: center;
        margin-top: 22px;
    }

    .password-footer a {
        color: #1c1917;
        font-family: "Plus Jakarta Sans", sans-serif;
        font-size: 13px;
        font-weight: 600;
        text-decoration: none;
    }

    .password-footer a:hover {
        text-decoration: underline;
    }

    @media (max-width: 600px) {
        .password-page {
            padding: 40px 18px;
        }

        .password-card {
            padding: 26px 22px;
        }
    }
</style>

<div class="password-page">
    <div class="password-wrapper">

        <div class="password-intro">
            <div class="password-eyebrow">Account recovery</div>

            <h1>Reset your password</h1>

            <p>
                Enter the email address associated with your Freelancer OS account.
                We'll send you a link to reset your password.
            </p>
        </div>

        <div class="password-card">

            <form method="post">
                {% csrf_token %}

                {{ form.as_p }}

                <button type="submit" class="password-submit">
                    Send reset link →
                </button>
            </form>

        </div>

        <div class="password-footer">
            <a href="{% url 'login' %}">← Back to login</a>
        </div>

    </div>
</div>

{% endblock %}
