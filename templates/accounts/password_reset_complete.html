{% extends "base.html" %}

{% block content %}

<style>
    .password-page {
        min-height: calc(100vh - 80px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 60px 24px;
        background: #fbfaf7;
    }

    .password-wrapper {
        width: 100%;
        max-width: 520px;
        text-align: center;
    }

    .password-eyebrow {
        font-family: "Plus Jakarta Sans", sans-serif;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #78716c;
        margin-bottom: 12px;
    }

    .password-card {
        background: #ffffff;
        border: 1px solid #e7e4dc;
        border-radius: 18px;
        padding: 40px 34px;
        box-shadow: 0 10px 35px rgba(28, 25, 23, 0.05);
    }

    .password-card h1 {
        font-family: "Newsreader", serif;
        font-size: clamp(38px, 6vw, 50px);
        font-weight: 500;
        line-height: 1;
        color: #1c1917;
        margin: 0 0 18px;
    }

    .password-card p {
        font-family: "Plus Jakarta Sans", sans-serif;
        font-size: 14px;
        line-height: 1.7;
        color: #78716c;
        max-width: 410px;
        margin: 0 auto;
    }

    .password-button {
        display: inline-block;
        margin-top: 28px;
        padding: 13px 24px;
        border-radius: 10px;
        background: #1c1917;
        color: #ffffff;
        font-family: "Plus Jakarta Sans", sans-serif;
        font-size: 13px;
        font-weight: 600;
        text-decoration: none;
        transition: transform 0.2s ease, opacity 0.2s ease;
    }

    .password-button:hover {
        opacity: 0.9;
        transform: translateY(-1px);
    }

    @media (max-width: 600px) {
        .password-page {
            padding: 40px 18px;
        }

        .password-card {
            padding: 32px 22px;
        }
    }
</style>

<div class="password-page">
    <div class="password-wrapper">

        <div class="password-eyebrow">Account recovery</div>

        <div class="password-card">

            <h1>Password updated</h1>

            <p>
                Your password has been successfully changed.
                You can now sign in with your new password.
            </p>

            <a href="{% url 'login' %}" class="password-button">
                Sign in →
            </a>

        </div>

    </div>
</div>

{% endblock %}
